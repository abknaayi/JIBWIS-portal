<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIBWIS Digital Management System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #173d63;
    }

    .loading {
      text-align: center;
    }

    .loading img {
      width: 85px;
      height: 85px;
      object-fit: contain;
    }

    .loader {
      width: 30px;
      height: 30px;
      border: 3px solid #d9c9aa;
      border-top-color: #173d63;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="loading">
    <img src="icon.png" alt="JIBWIS Logo">
    <h3>JIBWIS DIGITAL MANAGEMENT SYSTEM</h3>
    <p>Preparing your portal...</p>
    <div class="loader"></div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from
      "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, user => {
      window.location.replace(
        user ? "dashboard.html" : "login.html"
      );
    });
  </script>

</body>
</html>
